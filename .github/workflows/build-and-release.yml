name: Build and Release PsrShot

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package macOS App
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: swift test

      - name: Build, Verify and Package Release
        run: ./scripts/package_release.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PsrShot-macOS
          path: |
            PsrShot-macOS.zip
            PsrShot.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PsrShot-macOS.zip
            PsrShot.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
